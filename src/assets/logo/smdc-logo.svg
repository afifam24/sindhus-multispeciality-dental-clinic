<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Outer subtle circular badge outline (Transparent background) -->
  <circle cx="100" cy="100" r="92" stroke="#1d6b44" stroke-width="4" fill="none" opacity="0.15" />
  <circle cx="100" cy="100" r="88" fill="#e4f2ea" fill-opacity="0.3" />
  <circle cx="100" cy="100" r="80" fill="#1d6b44" fill-opacity="0.08" />
  
  <!-- Tooth Emblem -->
  <g transform="translate(42, 36) scale(0.58)">
    <!-- Tooth Body -->
    <path 
      d="M100 0 C145 0 195 25 195 75 C195 115 180 155 160 200 C145 235 125 240 100 170 C75 240 55 235 40 200 C20 155 5 115 5 75 C5 25 55 0 100 0 Z" 
