<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Outer subtle circular badge outline for dark surfaces -->
  <circle cx="100" cy="100" r="92" stroke="#e4f2ea" stroke-width="4" fill="none" opacity="0.3" />
  <circle cx="100" cy="100" r="88" fill="#e4f2ea" fill-opacity="0.1" />
  <circle cx="100" cy="100" r="80" fill="#ffffff" fill-opacity="0.06" />
  
  <!-- Tooth Emblem -->
  <g transform="translate(42, 36) scale(0.58)">
    <!-- Tooth Body in Mint / Pure White -->
    <path 
      d="M100 0 C145 0 195 25 195 75 C195 115 180 155 160 200 C145 235 125 240 100 170 C75 240 55 235 40 200 C20 155 5 115 5 75 C5 25 55 0 100 0 Z" 
      fill="#e4f2ea"
    />
    <!-- Tooth Arched Accent -->
    <path 
      d="M10 78 Q 100 115 190 78 Q 100 95 10 78 Z" 
      fill="#12492e"
      opacity="0.8"
    />
  </g>

  <!-- SMDC Typography in white/mint -->
  <text 
    x="100" 
    y="222" 
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
    font-size="28" 
    font-weight="800" 
    letter-spacing="4" 
    fill="#ffffff" 
    text-anchor="middle"
  >
    SMDC
  </text>
</svg>
